<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VocalSales — Cours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    --bg: #eef2f0; --card: #ffffff; --ink: #14302a; --muted: #56706a;
    --accent: #5b3fd1; --accent-ink: #ffffff; --line: #d8d3ee;
    --ok: #1d7a3e; --ko: #b3261e; --accent2: #9a6b00; --client2: #fdf0d9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a17; --card: #172521; --ink: #e4efeb; --muted: #9db3ad;
      --accent: #a78bfa; --accent-ink: #1a1540; --line: #3c3270;
      --ok: #6fd58f; --ko: #ff8a80; --accent2: #ffcf6b; --client2: #3a2e12;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    font-size: 18px; line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 48px; }
  h1, h2 { font-family: "Poppins", sans-serif; font-weight: 800; margin: 0 0 8px; }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.15rem; }
  .hidden { display: none !important; }
  .tagline { color: var(--muted); margin: 0 0 20px; }

  .band {
    background: linear-gradient(135deg, #1a1540 0%, #3d1f6b 55%, #5b1f5e 100%);
    color: #ece7fb; margin: -28px -20px 24px; padding: 24px 20px 20px;
    box-shadow: 0 0 0 100vmax #3d1f6b; clip-path: inset(0 -100vmax);
  }
  .band h1 { color: #ffffff; margin: 0 0 4px; }
  .band .crumb { font-size: .85rem; color: #cbb8f5; margin-bottom: 6px; }
  .band .niveau-badge {
    display: inline-block; background: rgba(255,255,255,.15); color: #ece7fb;
    padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700;
    margin-top: 6px;
  }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; display: grid; gap: 12px; margin-bottom: 16px;
  }
  .step-label {
    font-family: "Poppins", sans-serif; font-weight: 800; font-size: .82rem;
    color: var(--accent); text-transform: uppercase; letter-spacing: .04em;
  }

  .progress { display: flex; gap: 6px; margin: 0 0 20px; }
  .progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .progress span.done { background: var(--accent); }
  .progress span.current { background: var(--accent); opacity: .55; }

  .replique-ia {
    background: var(--client2); border-left: 4px solid var(--accent2);
    border-radius: 8px; padding: 14px 16px; font-size: 1.02rem; line-height: 1.5;
  }
  .replique-ia p { margin: 0 0 8px; }
  .replique-ia p:last-child { margin-bottom: 0; }

  .replique-eleve {
    background: var(--accent); color: var(--accent-ink); border-radius: 14px;
    padding: 12px 16px; font-size: 1rem; margin-top: 12px;
    border-bottom-right-radius: 4px; max-width: 90%; margin-left: auto;
  }

  textarea {
    font: inherit; resize: vertical; min-height: 100px; padding: 12px 14px;
    border-radius: 12px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); width: 100%;
  }
  textarea:focus-visible { outline: none; border-color: var(--accent); }

  button {
    font: inherit; font-weight: 800; border: 0; border-radius: 999px; cursor: pointer;
    padding: 13px 22px; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .status { min-height: 1.4em; font-weight: 700; color: var(--muted); }
  .status.err { color: var(--ko); }

  .niveau-choix { display: grid; gap: 12px; }
  .niveau-btn {
    text-align: left; background: var(--card); color: var(--ink);
    border: 2px solid var(--line); border-radius: 14px; padding: 16px 18px;
    cursor: pointer; font: inherit; font-weight: 400;
  }
  .niveau-btn:hover, .niveau-btn:focus-visible { border-color: var(--accent); outline: none; }
  .niveau-btn strong { display: block; font-weight: 800; font-size: 1.05rem; margin-bottom: 3px; }
  .niveau-btn span { color: var(--muted); font-size: .9rem; }

  .loading {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>

  <div class="band">
    <div class="crumb" id="crumb">VocalSales · Révision E2</div>
    <h1 id="titreCours">Chargement…</h1>
    <span class="niveau-badge hidden" id="niveauBadge"></span>
  </div>

  <div class="progress" id="progress"></div>

  <section id="screenNiveau" class="card hidden">
    <div class="step-label">Avant de commencer</div>
    <h2>Choisis ton niveau</h2>
    <p class="tagline" style="margin:0;">Tu pourras changer à tout moment en recommençant le cours.</p>
    <div class="niveau-choix">
      <button class="niveau-btn" data-niveau="decouverte">
        <strong>Découverte</strong>
        <span>Je vois la notion pour la première fois. Le prof m'accompagne pas à pas.</span>
      </button>
      <button class="niveau-btn" data-niveau="entrainement">
        <strong>Entraînement</strong>
        <span>Je connais déjà la notion. Je m'entraîne sur des situations concrètes.</span>
      </button>
      <button class="niveau-btn" data-niveau="maitrise">
        <strong>Maîtrise</strong>
        <span>Je prépare l'E2. Réponses rédigées, exigence d'examen.</span>
      </button>
    </div>
  </section>

  <section id="screenEtape" class="hidden">
    <div class="card">
      <div class="step-label" id="etapeLabel">Étape</div>
      <div id="zoneContenu"></div>
    </div>

    <div class="card">
      <label for="reponseInput">Ta réponse</label>
      <textarea id="reponseInput" placeholder="Écris ce que tu penses, avec tes mots…"></textarea>
      <div class="status" id="status"></div>
      <div class="actions">
        <button id="envoyerBtn" disabled>Envoyer</button>
        <button class="secondary" id="retourBtn">Retour à la liste</button>
      </div>
    </div>
  </section>

</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const coursCode = params.get("c");
let studentCode = null;
let niveau = "decouverte";
let etape = "accroche";
let historique = [];
let busy = false;

const ETAPES = [
  { id: "accroche", label: "Situation", num: 1 },
  { id: "observation", label: "On creuse", num: 2 },
  { id: "essentiel", label: "L'essentiel", num: 3 },
  { id: "dialogue", label: "Tes questions", num: 4 },
  { id: "verification", label: "Vérification", num: 5 },
  { id: "application", label: "Application", num: 6 },
  { id: "bilan", label: "Bilan", num: 7 }
];

function afficherProgression() {
  const idx = ETAPES.findIndex(e => e.id === etape);
  $("progress").innerHTML = ETAPES.map((e, i) => {
    const cls = i < idx ? "done" : (i === idx ? "current" : "");
    return '<span class="' + cls + '"></span>';
  }).join("");
}

function afficherEtape() {
  const info = ETAPES.find(e => e.id === etape);
  if (!info) return;
  $("etapeLabel").textContent = "Étape " + info.num + " · " + info.label;
  afficherProgression();
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.message || "Erreur"); e.code = data.error; throw e; }
  return data;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function init() {
  if (!coursCode) { location.href = "cours.html"; return; }
  const code = sessionStorage.getItem("vocalsales_code");
  if (!code) { location.href = "cours.html"; return; }
  studentCode = code;
  await chargerTitreCours();
  $("screenNiveau").classList.remove("hidden");
}

async function chargerTitreCours() {
  try {
    const data = await api("/api/cours/catalogue?code=" + encodeURIComponent(studentCode));
    const c = data.cours.find(x => x.code === coursCode);
    if (c) {
      $("titreCours").textContent = c.titre;
      $("crumb").textContent = "VocalSales · " + c.epreuve + " · Bloc " + c.bloc;
      document.title = "VocalSales — " + c.titre;
    } else {
      $("titreCours").textContent = "Cours introuvable";
    }
  } catch (e) {
    $("titreCours").textContent = "Erreur de chargement";
  }
}

document.querySelectorAll(".niveau-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    niveau = btn.dataset.niveau;
    const label = { decouverte: "Découverte", entrainement: "Entraînement", maitrise: "Maîtrise" }[niveau];
    $("niveauBadge").textContent = "Niveau " + label;
    $("niveauBadge").classList.remove("hidden");
    $("screenNiveau").classList.add("hidden");
    $("screenEtape").classList.remove("hidden");
    await enregistrerSession();
    await demarrerEtape("accroche");
  });
});

async function enregistrerSession() {
  try {
    await api("/api/cours/session", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: studentCode, cours_code: coursCode, niveau: niveau, statut: "en_cours", etape_atteinte: "accroche" })
    });
  } catch (e) { /* pas bloquant */ }
}

async function demarrerEtape(nouvelleEtape) {
  etape = nouvelleEtape;
  afficherEtape();
  $("zoneContenu").innerHTML = '<div class="status"><span class="loading"></span>Le prof réfléchit…</div>';
  $("reponseInput").value = "";
  $("reponseInput").disabled = true;
  $("envoyerBtn").disabled = true;
  busy = true;

  try {
    const res = await api("/api/cours/turn", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: studentCode, etape: etape, niveau: niveau, historique: historique, message: "" })
    });
    afficherRepliqueIA(res.replique);
    historique.push({ role: "assistant", content: res.replique });
    $("reponseInput").disabled = false;
    $("envoyerBtn").disabled = true;
    busy = false;
    $("status").textContent = "";
    $("reponseInput").focus();
  } catch (e) {
    $("zoneContenu").innerHTML = '<div class="status err">Impossible de charger l\'étape. Réessaie dans un instant.</div>';
    busy = false;
  }
}

function afficherRepliqueIA(texte) {
  $("zoneContenu").innerHTML = '<div class="replique-ia">' + escapeHtml(texte).replace(/\n/g, "<br>") + '</div>';
}

$("reponseInput").addEventListener("input", () => {
  $("envoyerBtn").disabled = busy || $("reponseInput").value.trim().length < 3;
});

$("envoyerBtn").addEventListener("click", async () => {
  if (busy) return;
  const texte = $("reponseInput").value.trim();
  if (!texte) return;

  busy = true;
  $("envoyerBtn").disabled = true;
  $("reponseInput").disabled = true;
  $("status").innerHTML = '<span class="loading"></span>Le prof réfléchit…';
  $("status").classList.remove("err");

  const ancienContenu = $("zoneContenu").innerHTML;
  $("zoneContenu").innerHTML = ancienContenu +
    '<div class="replique-eleve">' + escapeHtml(texte) + '</div>';

  historique.push({ role: "user", content: texte });

  try {
    const res = await api("/api/cours/turn", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: studentCode, etape: etape, niveau: niveau, historique: historique, message: texte })
    });
    afficherRepliqueIA(res.replique);
    historique.push({ role: "assistant", content: res.replique });
    $("reponseInput").value = "";
    $("reponseInput").disabled = false;
    $("status").textContent = "";

    if (res.etat === "etape_suivante") {
      const idx = ETAPES.findIndex(e => e.id === etape);
      if (idx >= 0 && idx < ETAPES.length - 1) {
        const suivante = ETAPES[idx + 1].id;
        setTimeout(() => demarrerEtape(suivante), 2000);
      }
    } else if (res.etat === "cours_terminé") {
      $("status").textContent = "Cours terminé !";
    } else {
      busy = false;
      $("envoyerBtn").disabled = true;
      $("reponseInput").focus();
    }
  } catch (e) {
    $("status").textContent = "Erreur. Réessaie.";
    $("status").classList.add("err");
    $("reponseInput").disabled = false;
    busy = false;
  }
});

$("retourBtn").addEventListener("click", () => {
  location.href = "cours.html";
});

init();
</script>
</body>
</html>
