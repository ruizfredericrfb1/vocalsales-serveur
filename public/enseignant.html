<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VocalSales — Espace enseignant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #eef2f0; --card: #ffffff; --ink: #14302a; --muted: #56706a;
    --accent: #1f6f5c; --accent-ink: #ffffff; --line: #cfdad6; --ko: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a17; --card: #172521; --ink: #e4efeb; --muted: #9db3ad;
      --accent: #4fb99c; --accent-ink: #0b1714; --line: #2a3b36; --ko: #ff8a80;
    }
  }
  * { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    font-size: 17px; line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 24px; }
  .hidden { display: none !important; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; display: grid; gap: 12px; margin-bottom: 20px;
  }
  label { font-weight: 700; font-size: 0.95rem; }
  input[type="text"], input[type="password"] {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); width: 100%;
  }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 12px; cursor: pointer;
    padding: 12px 18px; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { min-height: 1.4em; font-weight: 700; }
  .status.err { color: var(--ko); }
  .result {
    background: var(--accent); color: var(--accent-ink); border-radius: 12px;
    padding: 16px 18px; font-size: 1.1rem; text-align: center;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 0.85rem; }
  .inactive { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>VocalSales — Espace enseignant</h1>
  <p class="tagline">Ajouter des élèves et récupérer leur code de connexion, sans passer par GitHub.</p>

  <section id="screenLogin">
    <div class="card">
      <label for="pwInput">Mot de passe enseignant</label>
      <input id="pwInput" type="password" autocomplete="off">
      <div id="loginError" class="status err"></div>
      <button id="loginBtn">Se connecter</button>
    </div>
  </section>

  <div id="app" class="hidden">
    <div class="card">
      <h2 style="margin:0;">Ajouter un élève</h2>
      <label for="nomInput">Nom de l'élève</label>
      <input id="nomInput" type="text" placeholder="Ex : Dupont Léa">
      <label for="classeInput">Classe (facultatif)</label>
      <input id="classeInput" type="text" placeholder="Ex : Terminale MCV">
      <button id="createBtn">Créer et obtenir un code</button>
      <div id="createStatus" class="status"></div>
      <div id="createResult" class="result hidden"></div>
    </div>

    <div class="card">
      <h2 style="margin:0;">Élèves existants</h2>
      <div id="listStatus" class="status">Chargement…</div>
      <table id="studentsTable" class="hidden">
        <thead><tr><th>Code</th><th>Nom</th><th>Classe</th></tr></thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let password = "";

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.message || "Erreur"); e.code = data.error; throw e; }
  return data;
}

async function loadStudents() {
  $("listStatus").textContent = "Chargement…";
  $("listStatus").classList.remove("err");
  $("studentsTable").classList.add("hidden");
  try {
    const rows = await api("/api/teacher/students?password=" + encodeURIComponent(password));
    $("studentsBody").innerHTML = rows.map(s => `
      <tr class="${s.active ? "" : "inactive"}">
        <td>${s.code}</td><td>${s.nom}</td><td>${s.classe || ""}</td>
      </tr>
    `).join("");
    $("listStatus").textContent = rows.length ? "" : "Aucun élève pour l'instant.";
    $("studentsTable").classList.toggle("hidden", rows.length === 0);
  } catch (e) {
    $("listStatus").textContent = e.message || "Impossible de charger la liste.";
    $("listStatus").classList.add("err");
  }
}

$("loginBtn").onclick = async () => {
  password = $("pwInput").value;
  $("loginError").textContent = "";
  try {
    await api("/api/teacher/students?password=" + encodeURIComponent(password));
    $("screenLogin").classList.add("hidden");
    $("app").classList.remove("hidden");
    loadStudents();
  } catch (e) {
    $("loginError").textContent = e.message || "Mot de passe incorrect.";
  }
};
$("pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

$("createBtn").onclick = async () => {
  const nom = $("nomInput").value.trim();
  const classe = $("classeInput").value.trim();
  $("createStatus").textContent = "";
  $("createStatus").classList.remove("err");
  $("createResult").classList.add("hidden");
  if (!nom) { $("createStatus").textContent = "Le nom est obligatoire."; $("createStatus").classList.add("err"); return; }
  $("createBtn").disabled = true;
  try {
    const s = await api("/api/teacher/students", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ password, nom, classe })
    });
    $("createResult").textContent = "Code de " + s.nom + " : " + s.code;
    $("createResult").classList.remove("hidden");
    $("nomInput").value = ""; $("classeInput").value = "";
    loadStudents();
  } catch (e) {
    $("createStatus").textContent = e.message || "Erreur lors de la création.";
    $("createStatus").classList.add("err");
  } finally {
    $("createBtn").disabled = false;
  }
};
</script>
</body>
</html>
