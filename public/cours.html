<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VocalSales — Mes cours de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    --bg: #eef2f0; --card: #ffffff; --ink: #14302a; --muted: #56706a;
    --accent: #5b3fd1; --accent-ink: #ffffff; --line: #d8d3ee;
    --ok: #1d7a3e; --ko: #b3261e; --accent2: #9a6b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a17; --card: #172521; --ink: #e4efeb; --muted: #9db3ad;
      --accent: #a78bfa; --accent-ink: #1a1540; --line: #3c3270;
      --ok: #6fd58f; --ko: #ff8a80; --accent2: #ffcf6b;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
    font-size: 18px; line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 28px 20px 48px; }
  h1, h2, h3 { font-family: "Poppins", sans-serif; font-weight: 800; margin: 0 0 8px; }
  h1 { font-size: 1.6rem; }
  h2 { font-size: 1.2rem; }
  .hidden { display: none !important; }
  .tagline { color: var(--muted); margin: 0 0 20px; }

  .band {
    background: linear-gradient(135deg, #1a1540 0%, #3d1f6b 55%, #5b1f5e 100%);
    color: #ece7fb; margin: -28px -20px 24px; padding: 28px 20px 24px;
    box-shadow: 0 0 0 100vmax #3d1f6b; clip-path: inset(0 -100vmax);
  }
  .band h1 { color: #ffffff; margin: 0 0 4px; }
  .band .tagline { color: #a9bdb3; margin: 0; }
  .band .crumb { font-size: .85rem; color: #cbb8f5; margin-bottom: 6px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; display: grid; gap: 12px; margin-bottom: 16px;
  }
  label { font-weight: 700; font-size: .95rem; }
  input[type="text"] {
    font: inherit; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line);
    background: var(--card); color: var(--ink); width: 100%;
  }
  input[type="text"]:focus-visible { outline: none; border-color: var(--accent); }
  button {
    font: inherit; font-weight: 800; border: 0; border-radius: 999px; cursor: pointer;
    padding: 13px 22px; background: var(--accent); color: var(--accent-ink);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }

  .status { min-height: 1.4em; font-weight: 700; }
  .status.err { color: var(--ko); }

  .bloc-titre {
    font-family: "Poppins", sans-serif; font-weight: 800;
    color: var(--accent); font-size: .88rem;
    text-transform: uppercase; letter-spacing: .04em;
    margin: 22px 0 10px;
  }
  .bloc-titre:first-child { margin-top: 0; }

  .cours-liste { display: grid; gap: 10px; }
  .cours-item {
    display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; text-decoration: none; color: inherit; cursor: pointer;
  }
  .cours-item:hover, .cours-item:focus-visible {
    border-color: var(--accent); outline: none;
  }
  .cours-item.indisponible { opacity: .55; cursor: not-allowed; }
  .cours-item.indisponible:hover { border-color: var(--line); }

  .cours-etat {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; font-weight: 800;
    background: var(--bg); color: var(--muted);
    border: 2px solid var(--line);
  }
  .cours-item.termine .cours-etat { background: var(--ok); color: #fff; border-color: var(--ok); }
  .cours-item.en_cours .cours-etat { background: var(--accent); color: #fff; border-color: var(--accent); }

  .cours-titre { font-weight: 700; font-size: 1rem; }
  .cours-meta { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }

  .cours-badge {
    font-size: .78rem; font-weight: 700; padding: 5px 12px;
    border-radius: 999px; white-space: nowrap;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .cours-item.termine .cours-badge { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); border-color: transparent; }
  .cours-item.en_cours .cours-badge { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border-color: transparent; }
</style>
</head>
<body>
<main>

  <section id="screenLogin">
    <div class="band">
      <div class="crumb">VocalSales · Révision E2</div>
      <h1>Mes cours</h1>
      <p class="tagline">Connecte-toi avec le code que ton professeur t'a remis.</p>
    </div>
    <div class="card">
      <label for="codeInput">Ton code de connexion</label>
      <input id="codeInput" type="text" inputmode="numeric" placeholder="Ex : 2461" autocomplete="off">
      <div id="loginError" class="status err"></div>
      <button id="loginBtn" type="button">Se connecter</button>
    </div>
  </section>

  <section id="screenListe" class="hidden">
    <div class="band">
      <div class="crumb">VocalSales · Révision E2 — Option A</div>
      <h1 id="titreListe">Mes cours</h1>
      <p class="tagline" id="taglineListe">Choisis un cours pour commencer.</p>
    </div>
    <div id="listeStatus" class="status">Chargement…</div>
    <div id="listeCours" class="hidden"></div>
  </section>

</main>

<script>
const $ = (id) => document.getElementById(id);
let studentCode = null;

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(data.message || "Erreur"); e.code = data.error; throw e; }
  return data;
}

async function login(code) {
  const r = await fetch("/api/status?code=" + encodeURIComponent(code));
  if (!r.ok) throw new Error("Code inconnu.");
  return r.json();
}

$("loginBtn").onclick = async () => {
  const code = $("codeInput").value.trim();
  $("loginError").textContent = "";
  if (!code) return;
  try {
    const infos = await login(code);
    studentCode = code;
    $("screenLogin").classList.add("hidden");
    $("screenListe").classList.remove("hidden");
    $("titreListe").textContent = "Bonjour " + (infos.nom || "").split(" ")[0];
    $("taglineListe").textContent = "Voici tes cours de révision. Choisis où tu veux commencer.";
    chargerCatalogue();
  } catch (e) {
    $("loginError").textContent = e.message || "Connexion impossible.";
  }
};

$("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });

async function chargerCatalogue() {
  $("listeStatus").textContent = "Chargement…";
  $("listeStatus").classList.remove("err");
  $("listeCours").classList.add("hidden");
  try {
    const data = await api("/api/cours/catalogue?code=" + encodeURIComponent(studentCode));
    const parBloc = new Map();
    for (const c of data.cours) {
      if (!parBloc.has(c.bloc)) parBloc.set(c.bloc, { libelle: c.bloc_libelle, cours: [] });
      parBloc.get(c.bloc).cours.push(c);
    }
    let html = "";
    for (const [num, bloc] of [...parBloc.entries()].sort((a, b) => a[0] - b[0])) {
      html += '<div class="bloc-titre">Bloc ' + num + ' — ' + bloc.libelle + '</div>';
      html += '<div class="cours-liste">';
      for (const c of bloc.cours) {
        const statut = c.statut || "";
        const classes = ["cours-item"];
        if (statut) classes.push(statut);
        if (!c.disponible) classes.push("indisponible");
        let icone = "○";
        let badge = "Non commencé";
        if (statut === "termine") { icone = "✓"; badge = "Terminé" + (c.niveau ? " — " + c.niveau : ""); }
        else if (statut === "en_cours") { icone = "▶"; badge = "En cours"; }
        else if (!c.disponible) { badge = "Bientôt"; }
        html += '<a class="' + classes.join(" ") + '" ' +
          (c.disponible ? 'href="?c=' + c.code + '"' : 'aria-disabled="true"') + '>' +
          '<span class="cours-etat">' + icone + '</span>' +
          '<span><span class="cours-titre">' + c.titre + '</span>' +
          '<span class="cours-meta">' + c.epreuve + ' · Bloc ' + c.bloc + '</span></span>' +
          '<span class="cours-badge">' + badge + '</span>' +
          '</a>';
      }
      html += '</div>';
    }
    $("listeCours").innerHTML = html;
    $("listeStatus").textContent = "";
    $("listeCours").classList.remove("hidden");
  } catch (e) {
    $("listeStatus").textContent = e.message || "Impossible de charger les cours.";
    $("listeStatus").classList.add("err");
  }
}
</script>
</body>
</html>
