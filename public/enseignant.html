<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Enseignant — Suivi E33</title>
  <style>
    :root {
      --primary: #0f766e;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: var(--bg); color: #0f172a; }
    .card { background: white; border-radius: 12px; padding: 24px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { margin: 0; color: var(--primary); font-size: 1.4rem; }
    .btn-group { display: flex; gap: 8px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-secondary { background: #64748b; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f1f5f9; color: var(--primary); font-weight: 600; }
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 0.85rem; }
    .pass { background: #dcfce7; color: #15803d; }
    .fail { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h1>Tableau de Suivi — Oral E33 (Bac Pro MCV)</h1>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="fetchData()">↻ Actualiser</button>
        <button class="btn" onclick="exportCSV()">📥 Exporter sur Excel</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date & Heure</th>
          <th>Élève</th>
          <th>Scénario</th>
          <th>Note Globale</th>
          <th>Appréciation / Bilan</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" style="text-align:center;">Chargement...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let cachedData = [];

    async function fetchData() {
      const tbody = document.getElementById('tableBody');
      try {
        const res = await fetch('/api/get-evaluations');
        cachedData = await res.json();
        
        if (cachedData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Aucune évaluation enregistrée.</td></tr>';
          return;
        }

        tbody.innerHTML = cachedData.map(r => {
          const numNote = parseFloat(r.note.replace(',', '.'));
          const badgeClass = !isNaN(numNote) && numNote >= 10 ? 'pass' : 'fail';
          return `
            <tr>
              <td>${r.date} à ${r.heure}</td>
              <td><strong>${escapeHtml(r.eleve)}</strong></td>
              <td>${escapeHtml(r.scenario)}</td>
              <td><span class="badge ${badgeClass}">${escapeHtml(r.note)} / 20</span></td>
              <td><small>${escapeHtml(r.detail)}</small></td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Erreur lors de la récupération des données.</td></tr>';
      }
    }

    function exportCSV() {
      if (!cachedData.length) return alert("Aucune donnée à exporter.");
      
      let csv = "\uFEFFDate;Heure;Eleve;Scenario;Note;Appreciation\n";
      cachedData.forEach(r => {
        csv += `"${r.date}";"${r.heure}";"${r.eleve}";"${r.scenario}";"${r.note}";"${r.detail}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Suivi_E33_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchData();
  </script>
</body>
</html>
